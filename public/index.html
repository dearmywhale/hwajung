<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9C46A">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="화정 찬양부 — 하늘 습관으로 무장하자">
  <title>화정 찬양부</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // 화면을 그리기 전에 저장된 테마(자동/라이트/다크)를 적용해 깜빡임을 막는다
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('hj-theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"><div class="boot">불러오는 중…</div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
